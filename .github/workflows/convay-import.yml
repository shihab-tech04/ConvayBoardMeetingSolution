name: Convay exact ZIP mirror
on:
  push:
    branches:
      - source-import-2026-10-23
permissions:
  contents: write
jobs:
  import:
    if: github.event.head_commit.message == 'Stage exact ZIP transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staged ZIP segments
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and verify all source files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile, shutil, subprocess, os, stat
          root = Path.cwd()
          parts = sorted((root/'.import').glob('chunk-*.bin'))
          assert len(parts) == 46, f'Expected 46 transfer chunks, found {len(parts)}'
          assert [x.name for x in parts] == [f'chunk-{i:03d}.bin' for i in range(46)]
          archive = Path('/tmp/convay-verified-source.zip')
          with archive.open('wb') as target:
              for part in parts:
                  with part.open('rb') as src: shutil.copyfileobj(src, target)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == '99d141b4a3a4dd94db0006717137ccbdcfd582e1ab18303d9fdc887c8c4d830d', f'Wrong archive SHA256: {digest}'
          with zipfile.ZipFile(archive) as z:
              entries = [info for info in z.infolist() if not info.is_dir()]
              assert len(entries) == 938, f'File count mismatch: {len(entries)}'
              names = [info.filename for info in entries]
              assert len(set(names)) == len(names), 'Duplicate archive paths'
              for info in entries:
                  p = PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename, f'Unsafe ZIP path: {info.filename}'
                  assert p.parts[0] != '.git', f'Forbidden .git path: {info.filename}'
                  assert not stat.S_ISLNK(info.external_attr >> 16), f'Unexpected symlink: {info.filename}'
              for old in root.iterdir():
                  if old.name == '.git': continue
                  if old.is_dir() and not old.is_symlink(): shutil.rmtree(old)
                  else: old.unlink()
              expected = {}
              for info in entries:
                  data = z.read(info)
                  dest = root.joinpath(*PurePosixPath(info.filename).parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  executable = bool((info.external_attr >> 16) & 0o111)
                  os.chmod(dest, 0o755 if executable else 0o644)
                  gitblob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\x00' + data).hexdigest()
                  expected[info.filename] = ('100755' if executable else '100644', gitblob)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','--all','--force'], check=True)
          subprocess.run(['git','commit','-m','Import Convay Board Meeting solution: exact ZIP source'], check=True)
          actual = {}
          for record in subprocess.check_output(['git','ls-tree','-r','-z','HEAD']).split(b'\x00'):
              if not record: continue
              meta, rawpath = record.split(b'\t', 1)
              mode, kind, sha = meta.split(b' ')
              assert kind == b'blob', 'Unexpected non-file object'
              actual[rawpath.decode('utf-8')] = (mode.decode(),sha.decode())
          assert actual == expected, f'Committed file tree differs from ZIP: missing={set(expected)-set(actual)}, extra={set(actual)-set(expected)}, changed={sum(actual.get(k)!=v for k,v in expected.items())}'
          print('PASS: 938 Git-tracked paths and binary contents exactly match ZIP SHA256 '+digest)
          subprocess.run(['git','push','origin','HEAD:refs/heads/source-import-2026-10-23'],check=True)
          PY
