name: Convay Board Meeting — GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convay-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Report existing TypeScript diagnostics (non-blocking)
        continue-on-error: true
        run: pnpm exec tsc --noEmit --project tsconfig.release.json
      - name: Run application tests
        run: pnpm test
      - name: Verify router under GitHub Pages base path
        run: pnpm exec vitest run src/test/pages-router-basename.test.ts --base /ConvayBoardMeetingSolution/
      - name: Build for repository-subpath deployment
        run: pnpm exec vite build --config vite.figma.config.ts --base /ConvayBoardMeetingSolution/
      - name: Verify production entry
        run: |
          test -s dist/index.html
          grep -q '/ConvayBoardMeetingSolution/assets/' dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html
      - name: Provide deep-link recovery document for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          cmp dist/index.html dist/404.html
      - name: Embed exact release commit
        run: |
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/release.json
      - name: Upload production Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public URL, release SHA, and JavaScript asset
        env:
          PUBLIC_URL: https://shihab-tech04.github.io/ConvayBoardMeetingSolution/
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          base = os.environ["PUBLIC_URL"]
          expected = os.environ["GITHUB_SHA"]
          errors = []
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base + "release.json?release=" + expected, timeout=12) as response:
                      release = json.load(response)
                  if release.get("commit") != expected:
                      raise RuntimeError("Stale or unexpected public commit: " + repr(release))
                  with urllib.request.urlopen(base + "?release=" + expected, timeout=12) as response:
                      html = response.read().decode("utf-8")
                  if "Convay Board Meeting solution v3.0" not in html:
                      raise RuntimeError("Wrong site title: expected Convay Board Meeting solution v3.0")
                  match = re.search(r'<script[^>]+src="([^"]+\.js)"', html)
                  if not match:
                      raise RuntimeError("Compiled JavaScript entry missing")
                  src = match.group(1)
                  if not src.startswith("/ConvayBoardMeetingSolution/assets/"):
                      raise RuntimeError("Incorrect application asset base: " + src)
                  with urllib.request.urlopen("https://shihab-tech04.github.io" + src, timeout=15) as response:
                      js = response.read()
                  if len(js) < 500:
                      raise RuntimeError("Compiled JS entry unexpectedly small")
                  print("LIVE VERIFIED", base, "commit", expected, "asset", src, "size", len(js))
                  break
              except Exception as exc:
                  errors.append(str(exc))
                  if attempt == 17:
                      raise RuntimeError("Public site failed verification: " + "; ".join(errors[-3:]))
                  time.sleep(10)
          PY
      - name: Install pinned headless browser
        run: |
          npm install --prefix "$RUNNER_TEMP/convay-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/convay-browser/node_modules/.bin/playwright" install chromium
      - name: Verify the real browser renders the application and deep links
        env:
          PUBLIC_URL: https://shihab-tech04.github.io/ConvayBoardMeetingSolution/
        run: |
          NODE_PATH="$RUNNER_TEMP/convay-browser/node_modules" node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on("pageerror", err => errors.push(err.message));
              const base = process.env.PUBLIC_URL;
              for (const pathname of ["", "home/overview", "meetings/all-meetings"]) {
                await page.goto(base + pathname, { waitUntil: "networkidle", timeout: 60000 });
                await page.locator("#root").waitFor({ state: "visible", timeout: 30000 });
                const body = await page.locator("body").innerText();
                if (body.includes("Unexpected Application Error") ||
                    body.includes("Hey developer") ||
                    body.includes("404 Not Found")) {
                  throw new Error("Client-side route failure at " + pathname + ": " + body.slice(0, 400));
                }
                if (body.trim().length < 30) {
                  throw new Error("Empty application at " + pathname + ": " + body.slice(0, 200));
                }
                if (!new URL(page.url()).pathname.startsWith("/ConvayBoardMeetingSolution/")) {
                  throw new Error("App navigated outside Pages base: " + page.url());
                }
                if (errors.length) throw new Error("Browser runtime errors: " + errors.join("; "));
                console.log("BROWSER PASS", page.url(), "body length", body.length);
                await page.reload({ waitUntil: "networkidle", timeout: 60000 });
                const refreshed = await page.locator("body").innerText();
                if (refreshed.includes("Unexpected Application Error") ||
                    refreshed.includes("Hey developer") ||
                    refreshed.trim().length < 30) {
                  throw new Error("Refresh failed at " + pathname);
                }
                console.log("RELOAD PASS", page.url());
              }
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

