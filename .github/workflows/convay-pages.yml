name: Convay Board Meeting — GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convay-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Report existing TypeScript diagnostics (non-blocking)
        continue-on-error: true
        run: pnpm exec tsc --noEmit --project tsconfig.release.json
      - name: Run application tests
        run: pnpm test
      - name: Build for repository-subpath deployment
        run: pnpm exec vite build --config vite.figma.config.ts --base /ConvayBoardMeetingSolution/
      - name: Verify production entry
        run: |
          test -s dist/index.html
          grep -q '/ConvayBoardMeetingSolution/assets/' dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html
      - name: Embed exact release commit
        run: |
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/release.json
      - name: Upload production Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public URL, release SHA, and JavaScript asset
        env:
          PUBLIC_URL: https://shihab-tech04.github.io/ConvayBoardMeetingSolution/
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          base = os.environ["PUBLIC_URL"]
          expected = os.environ["GITHUB_SHA"]
          errors = []
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base + "release.json?release=" + expected, timeout=12) as response:
                      release = json.load(response)
                  if release.get("commit") != expected:
                      raise RuntimeError("Stale or unexpected public commit: " + repr(release))
                  with urllib.request.urlopen(base + "?release=" + expected, timeout=12) as response:
                      html = response.read().decode("utf-8")
                  if "Convay Board Meeting solution v3.0" not in html:
                      raise RuntimeError("Wrong site title: expected Convay Board Meeting solution v3.0")
                  match = re.search(r'<script[^>]+src="([^"]+\.js)"', html)
                  if not match:
                      raise RuntimeError("Compiled JavaScript entry missing")
                  src = match.group(1)
                  if not src.startswith("/ConvayBoardMeetingSolution/assets/"):
                      raise RuntimeError("Incorrect application asset base: " + src)
                  with urllib.request.urlopen("https://shihab-tech04.github.io" + src, timeout=15) as response:
                      js = response.read()
                  if len(js) < 500:
                      raise RuntimeError("Compiled JS entry unexpectedly small")
                  print("LIVE VERIFIED", base, "commit", expected, "asset", src, "size", len(js))
                  break
              except Exception as exc:
                  errors.append(str(exc))
                  if attempt == 17:
                      raise RuntimeError("Public site failed verification: " + "; ".join(errors[-3:]))
                  time.sleep(10)
          PY

