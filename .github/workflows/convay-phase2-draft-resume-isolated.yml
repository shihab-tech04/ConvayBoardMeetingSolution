name: Convay Phase 2 — staged draft resume disposable PG17
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/tests/phase2_draft_resume/**'
      - 'supabase/migrations/**'
      - '.github/workflows/convay-phase2-draft-resume-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-draft-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start disposable PostgreSQL 17
        run: |
          set -euo pipefail
          docker run -d --name convay-phase2-resume -e POSTGRES_PASSWORD=synthetic-test-only -e POSTGRES_DB=convay_phase2 -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17-alpine
          for i in $(seq 1 45); do
            if docker exec convay-phase2-resume pg_isready -U postgres -d convay_phase2 >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify tenant-scoped template and draft journey without cloud credentials
        run: docker exec convay-phase2-resume psql -X -v ON_ERROR_STOP=1 -U postgres -d convay_phase2 -v keep_concurrency_fixture=1 -f /workspace/supabase/tests/phase2_draft_resume/journey.psql
      - name: Exercise two-session draft authority races (synthetic only)
        run: bash supabase/tests/phase2_draft_resume/concurrency.sh
      - name: Destroy disposable database
        if: always()
        run: docker rm -f convay-phase2-resume || true
