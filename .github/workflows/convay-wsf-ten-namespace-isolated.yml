name: Convay WS-F TEN-04 — disposable PostgreSQL 17 tenant namespace uniqueness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/convay-wsf-ten-namespace-isolated.yml'
      - 'supabase/tests/wsf_ten_namespace/**'
      - 'supabase/tests/wsf_ten_foundation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-unique-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated PostgreSQL 17 without cloud connection or secrets
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name convay-wsf-ten04-db \
            -e POSTGRES_PASSWORD=synthetic-test-only \
            -e POSTGRES_DB=convay_wsf_ten04_fixture \
            -v "$GITHUB_WORKSPACE:/workspace:ro" postgres:17-alpine
          for attempt in $(seq 1 45); do
            if docker exec convay-wsf-ten04-db pg_isready -U postgres -d convay_wsf_ten04_fixture >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs convay-wsf-ten04-db
          exit 1
      - name: Create standalone legacy registry and Auth fixture
        run: |
          docker exec convay-wsf-ten04-db psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d convay_wsf_ten04_fixture \
            -f /workspace/supabase/tests/wsf_ten_foundation/bootstrap.sql
      - name: Create original hosted global unique index signatures
        run: |
          docker exec convay-wsf-ten04-db psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d convay_wsf_ten04_fixture \
            -f /workspace/supabase/tests/wsf_ten_namespace/legacy_unique_fixture.sql
      - name: Verify tenant-scoped keys, global collision fix and rollback
        run: |
          docker exec convay-wsf-ten04-db psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d convay_wsf_ten04_fixture \
            -f /workspace/supabase/tests/wsf_ten_namespace/namespace_matrix.psql
      - name: Destroy disposable database
        if: always()
        run: docker rm -f convay-wsf-ten04-db || true
